<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>结果</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    overflow: hidden;
    transition: background .5s;
  }
  body.ok   { background: linear-gradient(135deg, #0ba360, #3cba92); }
  body.fail { background: linear-gradient(135deg, #f5576c, #f093fb); }
  body.add  { background: linear-gradient(135deg, #4facfe, #00f2fe); }

  body::before, body::after {
    content: "";
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: .5;
    animation: float 8s ease-in-out infinite;
  }
  body::before { width: 400px; height: 400px; background: #fff; top: -120px; left: -120px; }
  body::after  { width: 360px; height: 360px; background: #fff; bottom: -100px; right: -100px; animation-delay: -4s; }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-30px); }
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(10px);
    padding: 50px 44px;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    text-align: center;
    width: 360px;
    animation: pop .5s cubic-bezier(.16,1,.3,1);
  }
  @keyframes pop {
    from { opacity: 0; transform: scale(.9); }
    to   { opacity: 1; transform: scale(1); }
  }

  .icon { font-size: 64px; margin-bottom: 16px; }
  h2 { color: #2c3e50; font-size: 24px; margin-bottom: 12px; letter-spacing: 1px; }
  .expr { font-size: 22px; color: #666; margin: 16px 0 8px; }
  .big {
    font-size: 56px;
    font-weight: 700;
    background: linear-gradient(135deg, #667eea, #764ba2);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 28px;
  }
  .msg { color: #999; font-size: 14px; margin-bottom: 28px; }

  a {
    display: inline-block;
    padding: 12px 32px;
    border-radius: 12px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    letter-spacing: 1px;
    box-shadow: 0 8px 20px rgba(102,126,234,.4);
    transition: all .25s;
  }
  a:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(102,126,234,.55); }
</style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">⏳</div>
    <h2 id="title">加载中</h2>
    <div class="expr" id="expr"></div>
    <div class="big" id="big"></div>
    <div class="msg" id="msg"></div>
    <a id="back" href="/login.html">返回</a>
  </div>

  <script>
    // 解析 URL 里的查询参数，如 ?type=ok&name=abc
    const params = new URLSearchParams(location.search);
    const type = params.get('type');

    const body  = document.body;
    const icon  = document.getElementById('icon');
    const title = document.getElementById('title');
    const expr  = document.getElementById('expr');
    const big   = document.getElementById('big');
    const msg   = document.getElementById('msg');
    const back  = document.getElementById('back');

    if (type === 'ok') {
      // 登录成功
      body.classList.add('ok');
      icon.textContent  = '✅';
      title.textContent = '登录成功';
      msg.textContent   = '欢迎，' + (params.get('name') || '') + '！';
      back.textContent  = '去加法页';
      back.href         = '/add.html';

    } else if (type === 'fail') {
      // 登录失败
      body.classList.add('fail');
      icon.textContent  = '❌';
      title.textContent = '登录失败';
      msg.textContent   = '账号密码不一致';
      back.textContent  = '重新登录';
      back.href         = '/login.html';

    } else if (type === 'add') {
      // 加法结果
      body.classList.add('add');
      icon.textContent  = '🧮';
      title.textContent = '计算结果';
      expr.textContent  = params.get('a') + ' + ' + params.get('b') + ' =';
      big.textContent   = params.get('sum');
      back.textContent  = '再算一次';
      back.href         = '/add.html';

    } else {
      // 未知类型
      title.textContent = '未知结果';
      back.textContent  = '返回首页';
      back.href         = '/login.html';
    }
  </script>
</body>
</html>
